<div class="flex h-screen overflow-hidden bg-[#f7faff]">

  <!-- MOBILE OVERLAY -->
  @if (mobileSidebarOpen) {
  <div class="fixed inset-0 z-40 bg-slate-900/30 backdrop-blur-[2px] lg:hidden" (click)="closeMobileSidebar()"> </div>
  }

  <!-- SIDEBAR -->
  <aside
    class=" fixed inset-y-0 left-0 z-50 flex flex-col border-r border-blue-100 bg-white shadow-[4px_0_24px_rgba(30,100,200,0.04)] transition-all duration-300 ease-in-out lg:relative lg:z-auto lg:translate-x-0 "
    [class.w-[260px]]="!sidebarCollapsed" [class.w-[78px]]="sidebarCollapsed" [class.translate-x-0]="mobileSidebarOpen"
    [class.-translate-x-full]="!mobileSidebarOpen" [class.lg:w-[260px]]="!sidebarCollapsed"
    [class.lg:w-[78px]]="sidebarCollapsed">

    <!-- Logo -->
    <div class=" flex h-20 shrink-0 items-center border-b border-blue-50 px-5 "
      [class.justify-center]="sidebarCollapsed" [class.px-0]="sidebarCollapsed">
      <a routerLink="/home" class="flex items-center gap-3">
        <!-- Wallet Logo -->
        <div class=" flex h-10 w-14 items-center justify-center">
          <img src="/images/my-wallet-logo.png" alt="My Wallet Logo" class="h-10 object-contain" />
        </div>
        @if (!sidebarCollapsed) {
        <div class="flex items-center justify-center">
          <img src="/images/my-wallet-title.png" alt="My Wallet Title" class="h-10 object-contain" />
        </div>
        }
      </a>
    </div>

    <!-- NAVIGATION -->
    <nav class="flex-1 px-3 py-5">
      <div class="space-y-1">
        @for (item of menus; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="bg-blue-50" [routerLinkActiveOptions]="{ exact: true }"
          #rla="routerLinkActive" class="group relative flex h-11 items-center rounded-xl
           text-[14px] font-medium text-slate-500
           transition-all duration-200
           hover:bg-blue-50 hover:text-blue-600" [class.justify-center]="sidebarCollapsed"
          [class.px-3]="!sidebarCollapsed" [class.gap-3]="!sidebarCollapsed">

          <!-- Active indicator -->
          <span class="absolute left-0 top-1/2 h-6 w-1
             -translate-y-1/2 rounded-r-full bg-blue-600
             transition-opacity duration-200" [class.opacity-100]="rla.isActive"
            [class.opacity-0]="!rla.isActive"></span>

          <!-- Icon -->
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
            [class.text-blue-600]="rla.isActive" [class.text-slate-500]="!rla.isActive">
            <fa-icon [icon]="item.icon" class="text-[22px]"></fa-icon>
          </span>

          <!-- Label -->
          @if (!sidebarCollapsed) {
          <span class="whitespace-nowrap" [class.text-blue-600]="rla.isActive" [class.text-slate-500]="!rla.isActive">
            {{ item.label }}
          </span>
          }

          <!-- Collapsed Tooltip -->
          @if (sidebarCollapsed) {
          <span class="pointer-events-none absolute left-[68px] top-1/2 z-[100]
               -translate-y-1/2 whitespace-nowrap rounded-lg
               bg-slate-900 px-3 py-2 text-xs font-medium text-white
               opacity-0 shadow-lg transition-all duration-150
               group-hover:translate-x-1 group-hover:opacity-100">
            {{ item.label }}

            <span class="absolute left-[-4px] top-1/2 h-2 w-2
                 -translate-y-1/2 rotate-45 bg-slate-900"></span>
          </span>
          }
        </a>
        }

      </div>

    </nav>

    <!-- SIDEBAR COLLAPSE BUTTON -->
    <div class="border-t border-blue-50 p-3">
      <button type="button" (click)="toggleSidebar()" class="
          group relative flex h-11 w-full
          items-center cursor-pointer
          rounded-xl
          text-slate-500
          transition
          hover:bg-blue-50
          hover:text-blue-600
        " [class.justify-center]="sidebarCollapsed" [class.px-3]="!sidebarCollapsed">

        <span class="flex h-8 w-8 items-center justify-center">
          <svg class="h-5 w-5 transition-transform duration-300" [class.rotate-180]="sidebarCollapsed"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </span>

        @if (!sidebarCollapsed) {
        <span class="text-sm font-medium">
          Collapse Menu
        </span>
        }

        @if (sidebarCollapsed) {
        <span class="
              pointer-events-none
              absolute left-[68px]
              whitespace-nowrap
              rounded-lg bg-slate-900
              px-3 py-2
              text-xs text-white
              opacity-0
              shadow-lg
              group-hover:opacity-100
            ">
          Expand Menu
        </span>
        }
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- TOP NAVBAR -->
    <header class="
        relative z-30
        flex h-20 shrink-0
        items-center
        border-b border-blue-50
        bg-white/95
        px-4
        shadow-[0_2px_12px_rgba(30,100,200,0.03)]
        backdrop-blur
        sm:px-6
        lg:px-8
      ">

      <!-- Mobile menu button -->
      <button type="button" class="
          mr-3 flex h-10 w-10
          items-center justify-center
          rounded-xl
          text-slate-600
          hover:bg-blue-50
          hover:text-blue-600
          lg:hidden
        " (click)="toggleMobileSidebar()">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Right side -->
      <div class="ml-auto flex items-center gap-2 sm:gap-4">      
        <!-- Divider -->
        <div class="hidden h-8 w-px bg-blue-100 sm:block"></div>
        <!-- Profile -->
        <div #profileMenuRef class="relative">

          <button type="button" (click)="toggleProfileMenu($event)" class="
              flex items-center gap-2
              rounded-xl cursor-pointer
              p-1.5
              transition
              hover:bg-blue-50
            ">

            <!-- Avatar -->
            <div class=" flex h-9 w-9 items-center justify-center overflow-hidden rounded-full bg-blue-100 ">
              <span class="text-sm font-semibold text-blue-700"> SM </span>
            </div>

            <div class="hidden text-left sm:block">
              <p class=" text-sm font-semibold text-[#123c85] "> Subin Mathew </p>
            </div>

            <svg class=" hidden h-4 w-4 text-slate-500 transition-transform sm:block " [class.rotate-180]="profileMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>


          <!-- Profile Dropdown -->
          @if (profileMenuOpen) {

          <div class=" absolute right-0 top-14 z-50 w-56 overflow-hidden rounded-2xl border border-blue-100 bg-white p-2 shadow-xl ">
            <div class=" border-b border-slate-100 px-3 py-3 ">
              <p class="text-sm font-semibold text-slate-800"> Subin Mathew </p>
            </div>
            <a routerLink="/profile" 
                class=" mt-1 flex items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 ">
              Profile
            </a>
            <a routerLink="/settings" 
                class=" flex items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 ">
              Settings
            </a>
            <button type="button" class=" flex cursor-pointer w-full items-center rounded-xl px-3 py-2.5 text-left text-sm text-red-500 hover:bg-red-50 "> Sign out </button>
          </div>
          }
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class=" flex-1 overflow-y-auto bg-[#f7faff] p-4 sm:p-6 lg:p-8 ">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
